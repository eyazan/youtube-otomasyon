  .card h3 { margin: 0 0 18px; font: 800 38px Inter; }

{ let r = 7; const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647; const p = [];

const black = new THREE.MeshStandardMaterial({ color: 0x1b1d22, roughness: 0.6, metalness: 0.2 });
const metal = new THREE.MeshStandardMaterial({ color: 0x8c9098, roughness: 0.35, metalness: 0.8 });

{ let x = 0; const add = (m, len) => { m.position.x = x + len / 2; gBody.add(m); x += len; };

{ const silver = new THREE.MeshStandardMaterial({ color: 0xc9ccd2, roughness: 0.4, metalness: 0.6 });

const ui = document.getElementById("ui");
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const KEY = new Set(["spinning", "faster", "stuck", "undocking", "stop", "early", "isolate", "thrusters", "thruster"]);
const capHtml = (c) => c ? `<div class="cap">${c.lines.map((l) => l.split(" ").map((w) => KEY.has(w.toLowerCase().replace(/[^a-z]/g, "")) ? `<b>${esc(w)}</b>` : esc(w)).join(" ")).join("<br>")}</div>` : "";
const cue = (t) => D.cues.find((c) => t >= c.start && t < c.end + 0.05);

const M = D.model; const deg = (x) => x * Math.PI / 180;

    const back = ease(clamp((t - (s.b - 0.7)) / 0.7)); const hookPos = new THREE.Vector3(-11, 9.5, 19), hookTgt = new THREE.Vector3(2.6, -2.2, 0);
    look(new THREE.Vector3(-14 + 6 * k, 5 + 2 * k, 16 - 2 * k).lerp(hookPos, back), new THREE.Vector3(2.4, -3 + k, 0).lerp(hookTgt, back), 32, -0.6 * back);
    if (back > 0) { gBody.rotation.x = deg(M.peak) * (t - s.b + 0.7) * back; roll8.getObjectByName("plume").visible = back > 0.5; }
    html += `<div class="head">THE FIX</div>`;
    html += `<div class="card" style="opacity:${clamp(k * 5) * (1 - clamp((t - (s.b - 0.9)) / 0.4))}"><div class="k">THRUSTER CIRCUITS</div><h3>One fault, one thruster</h3>

      <div class="row"><span class="dot" style="background:#5fe1ff"></span>After: each thruster can be isolated</div></div>`;
  }
  html += capHtml(cue(t)); if (chips.length) html += `<div class="chip">${chips.join(" · ")}</div>`;
  ui.innerHTML = html; renderer.render(scene, cam);
};
