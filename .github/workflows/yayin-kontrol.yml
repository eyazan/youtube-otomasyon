name: Yayin kontrolu

# Zamanlanmis video (publishAt 18:00 UTC) gercekten Public oldu mu? Olduysa videonun
# bildirim issue'suna "✅ Yayina girdi" yorumu duser; bir saat gectigi halde olmadiysa
# "❌ Otomatik yayin gerceklesmedi" issue'su acilir. Sadece OKUR; videoya dokunmaz.
# GitHub zamanlanmis isleri geciktirebildigi icin iki saat.
on:
  schedule:
    - cron: '25 18 * * *'
    - cron: '40 19 * * *'
  workflow_dispatch:

# Uretimle ayni grup: ayni anda iki is depoya yazmasin.
concurrency:
  group: uretim
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Yayin durumunu kontrol et ve bildir
        run: node bildirim.js --yayin-kontrol
      - name: Bildirim durumunu kaydet
        run: |
          git config user.name  "uretim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add icerik/bildirim-durum.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "degisiklik yok"; exit 0; fi
          git commit -m "chore: yayin kontrolu (otomatik)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push && exit 0; sleep $((i * 5)); done
          exit 1
