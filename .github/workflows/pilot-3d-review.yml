name: Pilot 3D review (isolated Three.js pilots, never publishable)

# Review-only measurement of the isolated Three.js pilots (pilots/) against the current premium studio, on the same
# GitHub runner: real MP4s, contact and scene sheets, technical QA, wall time and CPU/RAM (GNU time -v). Nothing is
# uploaded to YouTube, nothing is reserved or approved, no channel state is written or committed. Runs only on the pilot
# branch; the production render path and its workflows are untouched.
on:
  push:
    branches: [pilot/gll-magnus-3d]
    paths: ['pilots/**', '.github/workflows/pilot-3d-review.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-3d-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PUBLISH: '0'
      BTO_PREMIUM_RENDER: preview
      EDGE_RATE_LIMIT_RETRIES: '6'
      PD_CHROMIUM: /usr/bin/google-chrome
      OUT: review-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/bto-studio/requirements.txt
      - name: Runtime dependencies
        run: |
          bash scripts/ci-apt.sh --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation python3-pil time
          npm ci --no-audit --no-fund
          python -m pip install --quiet -r scripts/bto-studio/requirements.txt
          node scripts/bto-studio/preflight-deps.js
          for d in gll-magnus-3d fr-gemini8-3d kit; do (cd pilots/$d && npm ci --no-audit --no-fund); done
          mkdir -p "$OUT"; { echo "runner: $(nproc) vCPU, $(free -g | awk '/Mem/{print $2}') GB RAM, $(lscpu | sed -n 's/Model name: *//p')"; } | tee "$OUT/runner.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Current engine, GLL-P01 (pilot, 2 workers)
        run: |
          set -o pipefail
          /usr/bin/time -v -o "$OUT/time-gll-current.txt" node scripts/bto-studio/studio.js --pilot channels/goal-lore-lab/premium/pilots/GLL-P01 --quality final --workers 2 2>&1 | tee "$OUT/log-gll-current.txt" | tail -12
      - name: Current engine, FR Gemini 8 (shadow, never publishable, 2 workers)
        run: |
          set -o pipefail
          /usr/bin/time -v -o "$OUT/time-fr-current.txt" node scripts/bto-studio/studio.js --channel failure-reconstructed --topic gemini-8-1966 --shadow --shadow-dir "$RUNNER_TEMP/fr" --regenerate --quality final --voice edge --workers 2 2>&1 | tee "$OUT/log-fr-current.txt" | tail -12

      - name: Current engine, GLL-025 Panenka and FR Ariane 5 (reuse topics; shadow, never publishable, 2 workers)
        run: |
          set -o pipefail
          /usr/bin/time -v -o "$OUT/time-gll025-current.txt" node scripts/bto-studio/studio.js --channel goal-lore-lab --topic GLL-025 --shadow --shadow-dir "$RUNNER_TEMP/gll025" --regenerate --quality final --voice edge --workers 2 2>&1 | tee "$OUT/log-gll025-current.txt" | tail -12
          /usr/bin/time -v -o "$OUT/time-ariane-current.txt" node scripts/bto-studio/studio.js --channel failure-reconstructed --topic ariane-5-flight-501 --shadow --shadow-dir "$RUNNER_TEMP/ariane" --regenerate --quality final --voice edge --workers 2 2>&1 | tee "$OUT/log-ariane-current.txt" | tail -12
          # four more GLL topics the planner now covers (law distance, back-pass rule, knuckle ball, a second free kick)
          for id in GLL-026 GLL-043 GLL-052 GLL-061; do
            node scripts/bto-studio/studio.js --channel goal-lore-lab --topic $id --shadow --shadow-dir "$RUNNER_TEMP/$id" --regenerate --quality final --voice edge --workers 2 > "$OUT/log-$id-current.txt" 2>&1 || echo "$id current engine failed"; tail -3 "$OUT/log-$id-current.txt"; done

      # v2: one driver, no topic code. The planner reads each topic's narration and facts, picks a mechanism template and
      # writes plan.json (or refuses with CREATIVE_REVIEW_REQUIRED); the kit renders the plan over the narration above.
      - name: Kit v2 (plan-driven), four topics + QA
        run: |
          set -o pipefail
          node -e "const t=require('./channels/goal-lore-lab/topics/topic-universe.json');const a=Array.isArray(t)?t:(t.topics||t);for(const id of ['GLL-025','GLL-026','GLL-043','GLL-052','GLL-061'])require('fs').writeFileSync(process.env.RUNNER_TEMP+'/'+id+'.json',JSON.stringify(a.find(x=>x.id===id)))"
          K=pilots/kit/render-plan.js; G=channels/goal-lore-lab/premium/pilots/GLL-P01
          run() { /usr/bin/time -v -o "$OUT/time-$1-kit.txt" node $K --name "$1" --out "$OUT/kit/$1" --workers 2 --topic "$2" --audio-from "$3" 2>&1 | tee "$OUT/log-$1-kit.txt" | grep -vE '^PASS' || true; }
          run gll-p01 "$G/topic.json" "$G/out"
          run fr-gemini8 icerik/konular/gemini-8-1966.json "$RUNNER_TEMP/fr/out"
          run gll-025 "$RUNNER_TEMP/GLL-025.json" "$RUNNER_TEMP/gll025/out"
          run fr-ariane501 icerik/konular/ariane-5-flight-501.json "$RUNNER_TEMP/ariane/out"
          for id in GLL-026 GLL-043 GLL-052 GLL-061; do run "$id" "$RUNNER_TEMP/$id.json" "$RUNNER_TEMP/$id/out"; done
          # coverage: plan every researched GLL topic (planning only, no render): PLANNED or CREATIVE_REVIEW_REQUIRED with reasons
          node pilots/kit/coverage.js | tee "$OUT/coverage.md"

      - name: Three.js pilot v1 (hand-written), GLL-P01 (same narration and captions, 2 workers) + QA
        run: |
          set -o pipefail
          P=channels/goal-lore-lab/premium/pilots/GLL-P01/out
          /usr/bin/time -v -o "$OUT/time-gll-threejs.txt" node pilots/gll-magnus-3d/render.js --audio-from "$P" --workers 2 | tee "$OUT/log-gll-threejs.txt"
          node pilots/gll-magnus-3d/qa.js --audio-from "$P" | tee "$OUT/qa-gll-threejs.txt" || true
      - name: Three.js pilot v1 (hand-written), FR Gemini 8 (same narration and captions, 2 workers) + QA
        run: |
          set -o pipefail
          /usr/bin/time -v -o "$OUT/time-fr-threejs.txt" node pilots/fr-gemini8-3d/render.js --audio-from "$RUNNER_TEMP/fr/out" --workers 2 | tee "$OUT/log-fr-threejs.txt"
          node pilots/fr-gemini8-3d/qa.js --audio-from "$RUNNER_TEMP/fr/out" | tee "$OUT/qa-fr-threejs.txt" || true

      - name: Collect review package
        if: always()
        run: |
          G=channels/goal-lore-lab/premium/pilots/GLL-P01/out; F="$RUNNER_TEMP/fr/out"
          for pair in "gll/current:$G" "fr/current:$F" "gll/threejs:pilots/gll-magnus-3d/out" "fr/threejs:pilots/fr-gemini8-3d/out"; do
            dest=${pair%%:*}; src=${pair#*:}; mkdir -p "$OUT/$dest"
            for f in video-final.mp4 gll-p01-magnus-3d.mp4 fr-gemini8-3d.mp4 contact-sheet.png scene-sheet.png qa-report.md qa-report.json creative-review.md creative-review.json render-report.json text-layout-issues.json; do
              [ -e "$src/$f" ] && cp "$src/$f" "$OUT/$dest/"; done
            for m in "$OUT/$dest"/*.mp4; do [ -e "$m" ] && (cd "$OUT/$dest" && sha256sum "$(basename "$m")" >> mp4.sha256) && ffmpeg -hide_banner -loglevel error -i "$m" -t 2 -vf "fps=6,scale=270:-2,tile=6x2" -frames:v 1 "$OUT/$dest/first-2s.jpg"; done
          done
          # before/after: current engine | kit v2, side by side at half size, same narration (v1 | v2 for the two v1 pilots)
          sbs() { [ -e "$1" ] && [ -e "$2" ] && ffmpeg -hide_banner -loglevel error -y -i "$1" -i "$2" -filter_complex "[0:v]scale=540:960[a];[1:v]scale=540:960[b];[a][b]hstack=2[v]" -map "[v]" -map 1:a -c:v libx264 -crf 22 -preset veryfast -c:a aac "$3" || true; }
          mkdir -p "$OUT/compare"
          sbs "$G/video-final.mp4" "$OUT/kit/gll-p01/gll-p01.mp4" "$OUT/compare/gll-p01_current-vs-kit.mp4"
          sbs "$F/video-final.mp4" "$OUT/kit/fr-gemini8/fr-gemini8.mp4" "$OUT/compare/fr-gemini8_current-vs-kit.mp4"
          sbs "$RUNNER_TEMP/gll025/out/video-final.mp4" "$OUT/kit/gll-025/gll-025.mp4" "$OUT/compare/gll-025_current-vs-kit.mp4"
          sbs "$RUNNER_TEMP/ariane/out/video-final.mp4" "$OUT/kit/fr-ariane501/fr-ariane501.mp4" "$OUT/compare/fr-ariane501_current-vs-kit.mp4"
          for id in GLL-026 GLL-043 GLL-052 GLL-061; do sbs "$RUNNER_TEMP/$id/out/video-final.mp4" "$OUT/kit/$id/$id.mp4" "$OUT/compare/${id}_current-vs-kit.mp4"; done
          sbs pilots/gll-magnus-3d/out/gll-p01-magnus-3d.mp4 "$OUT/kit/gll-p01/gll-p01.mp4" "$OUT/compare/gll-p01_v1-vs-kit.mp4"
          sbs pilots/fr-gemini8-3d/out/fr-gemini8-3d.mp4 "$OUT/kit/fr-gemini8/fr-gemini8.mp4" "$OUT/compare/fr-gemini8_v1-vs-kit.mp4"
          for t in gll025:gll-025 ariane:fr-ariane501; do src="$RUNNER_TEMP/${t%%:*}/out"; dest="$OUT/${t#*:}/current"; mkdir -p "$dest"
            for f in video-final.mp4 contact-sheet.png scene-sheet.png qa-report.md creative-review.md; do [ -e "$src/$f" ] && cp "$src/$f" "$dest/"; done; done
          for d in "$OUT"/kit/*/; do for m in "$d"*.mp4; do [ -e "$m" ] && ffmpeg -hide_banner -loglevel error -i "$m" -t 2 -vf "fps=6,scale=270:-2,tile=6x2" -frames:v 1 "$d/first-2s.jpg"; done; done
          cp pilots/COMPARISON.md pilots/gll-magnus-3d/MODEL.md "$OUT/gll/" 2>/dev/null || true; cp pilots/fr-gemini8-3d/MODEL.md "$OUT/fr/" 2>/dev/null || true
          cp pilots/*/CREATIVE-REVIEW.md "$OUT/" 2>/dev/null || true
          {
            echo "| run | wall (time -v) | max RSS, largest single process | user+sys CPU (incl. children) | frames render |"; echo "|---|---|---|---|---|"
            for r in gll-current gll-threejs gll-p01-kit fr-current fr-threejs fr-gemini8-kit gll025-current gll-025-kit ariane-current fr-ariane501-kit GLL-026-kit GLL-043-kit GLL-052-kit GLL-061-kit; do t="$OUT/time-$r.txt"; [ -e "$t" ] || continue
              wall=$(sed -n 's/.*Elapsed (wall clock) time.*: //p' "$t"); rss=$(sed -n 's/.*Maximum resident set size (kbytes): //p' "$t")
              cpu=$(awk -F': ' '/User time|System time/{s+=$2} END{printf "%.0f s", s}' "$t")
              fr=$(grep -hE '^render:|"frameWallSeconds"' "$OUT/log-$r.txt" 2>/dev/null | head -1 | tr -d ',')
              echo "| $r | $wall | $((rss / 1024)) MB | $cpu | $fr |"; done
            echo; [ -e "$OUT/coverage.md" ] && cat "$OUT/coverage.md"
            echo; for l in "$OUT"/log-*-kit.txt; do [ -e "$l" ] && echo "**$(basename "$l")**: $(grep -E '^(plan|render|qa):' "$l" | tr '\n' ' ')" && grep -E '^(FAIL|WARN|- )' "$l" | sed 's/^/  - /'; done
            echo; for q in "$OUT"/qa-*-threejs.txt; do [ -e "$q" ] && { echo "**$(basename "$q")**: $(tail -1 "$q")"; grep -E '^(FAIL|WARN)' "$q" | sed 's/^/- /'; }; done
            for l in "$OUT"/log-*-current.txt; do echo "**$(basename "$l")**: $(grep -E '^qa:|^narration:' "$l" | tr '\n' ' ')"; done
          } | tee -a "$GITHUB_STEP_SUMMARY" > "$OUT/summary.md"
          cat "$OUT/summary.md"; grep -h '^render:' "$OUT"/log-*-current.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-3d-review
          path: review-out
          retention-days: 30
          if-no-files-found: warn
