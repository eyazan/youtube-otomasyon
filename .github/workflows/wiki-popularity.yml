name: Topic popularity refresh

# Monthly: average Wikipedia pageviews of every topic's own article
# (config/wiki-popularity.json), read by the topic scorer. Public API, no key.
on:
  schedule:
    - cron: '17 3 2 * *'
  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Fetch pageviews
        run: node scripts/wiki-popularity.js
      - name: Commit
        run: |
          git config user.name "popularity-bot"
          git config user.email "actions@users.noreply.github.com"
          git config merge.json-union.driver "node scripts/git-json-merge.js %O %A %B"
          git add config/wiki-popularity.json
          bash scripts/ci/push-if-green.sh "chore: refresh topic popularity (Wikipedia pageviews)"
