name: Testler

# Her push / PR'da: JS birim testleri + sozdizimi kontrolu + Python testleri.
# Ag erisimi ve kimlik bilgisi GEREKTIRMEZ (YouTube cagrisi yapilmaz).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bagimliliklar
        run: npm install --no-audit --no-fund
      - name: JS testleri + sozdizimi
        run: node --test tests/js/*.test.js
      - name: Python testleri
        run: python -m unittest discover -s tests
