name: Shorts uretim (3 gunde bir)

# 3 gunde bir 06:00 UTC. Cron ayin gunlerine gore calisir (1,4,7,...,28,31),
# bu yuzden ay sonunda tek seferlik 2 gunluk bosluk olur — kabul edilebilir.
# Elle de tetiklenebilir (Actions sekmesi > Run workflow).
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
    inputs:
      hepsi:
        description: 'Tum uretilmemis konulari uret (yoksa sadece sonraki)'
        type: boolean
        default: false

# Ayni anda tek uretim; devam eden calisma iptal edilmez.
concurrency:
  group: uretim
  cancel-in-progress: false

permissions:
  contents: write   # uretilenler.json'u geri commit etmek icin

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Yukleme kimlik bilgileri — repo Secrets (yoksa yukleme atlanir).
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      # Yukleme yalnizca PUBLISH=1 iken (repo Variables). Yoksa uretir, yuklemez.
      PUBLISH: ${{ vars.PUBLISH }}
      # Altyazi fontu (ubuntu'da kurulu bir font).
      SHORTS_FONT: 'DejaVu Sans'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ffmpeg + font kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Bagimliliklar
        run: npm install --no-audit --no-fund

      - name: Ortami dogrula
        run: node youtube-yukle.js dummy --dogrula || true

      - name: Sonraki Shorts'u uret
        run: |
          if [ "${{ github.event.inputs.hepsi }}" = "true" ]; then
            node shorts-sira.js --hepsi
          else
            node shorts-sira.js
          fi

      - name: Uretim durumunu geri commit et
        if: always()
        run: |
          git config user.name  "uretim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add icerik/uretilenler.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: uretim ilerlemesi (otomatik)"
            git push
          else
            echo "Uretimde degisiklik yok."
          fi
