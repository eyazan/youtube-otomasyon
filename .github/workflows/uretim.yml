name: Uretim (3 gunde bir)

# 3 gunde bir 06:00 UTC. Cron ayin gunlerine gore calisir (1,4,7,...,28,31),
# bu yuzden ay sonunda tek seferlik 2 gunluk bosluk olur — kabul edilebilir.
# Elle de tetiklenebilir (Actions sekmesi > Run workflow).
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
    inputs:
      hepsi:
        description: 'Kuyrugun tamamini uret (yoksa sadece en eski is)'
        type: boolean
        default: false

# Ayni anda tek uretim; devam eden calisma iptal edilmez.
concurrency:
  group: uretim
  cancel-in-progress: false

permissions:
  contents: write   # islenen kuyruk dosyalarini geri commit etmek icin

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # Yukleme kimlik bilgileri — repo Secrets'tan gelir (yoksa yukleme atlanir).
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      # Ucretli senaryo uretimi — sadece narration verilmeyen isler icin gerekir.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      # Yukleme yalnizca PUBLISH=1 iken yapilir (repo Variables). Varsayilan: yukleme.
      PUBLISH: ${{ vars.PUBLISH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Bagimliliklar
        run: npm install --no-audit --no-fund

      - name: Ortami dogrula
        run: node youtube-yukle.js dummy --dogrula || true

      - name: Kuyrugu isle
        run: |
          if [ "${{ github.event.inputs.hepsi }}" = "true" ]; then
            python3 -m shortslab.kuyruk --hepsi
          else
            python3 -m shortslab.kuyruk
          fi

      - name: Islenen kuyrugu geri commit et
        if: always()
        run: |
          git config user.name  "uretim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kuyruk/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: kuyruk ilerlemesi (otomatik)"
            git push
          else
            echo "Kuyrukta degisiklik yok."
          fi
