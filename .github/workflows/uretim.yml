name: Shorts uretim (gunluk)

# Her gun 06:00 UTC bir Shorts uretir (profesyonel tempo: gunde 1).
# Elle de tetiklenebilir (Actions sekmesi > Run workflow) veya --hepsi ile
# uretilmemis tum konular tek seferde uretilir.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      hepsi:
        description: 'Tum uretilmemis konulari uret (yoksa sadece sonraki)'
        type: boolean
        default: false

# Ayni anda tek uretim; devam eden calisma iptal edilmez.
concurrency:
  group: uretim
  cancel-in-progress: false

permissions:
  contents: write   # uretilenler.json'u geri commit etmek icin

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Yukleme kimlik bilgileri — repo Secrets (yoksa yukleme atlanir).
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      # Yukleme yalnizca PUBLISH=1 iken (repo Variables). Yoksa uretir, yuklemez.
      PUBLISH: ${{ vars.PUBLISH }}
      # Altyazi fontu (ubuntu'da kurulu bir font).
      SHORTS_FONT: 'DejaVu Sans'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ffmpeg + font kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Bagimliliklar
        run: npm install --no-audit --no-fund

      - name: Ortami dogrula
        run: node youtube-yukle.js dummy --dogrula || true

      - name: Sonraki Shorts'u uret
        run: |
          if [ "${{ github.event.inputs.hepsi }}" = "true" ]; then
            node shorts-sira.js --hepsi
          else
            node shorts-sira.js
          fi

      - name: Uretilen videoyu artifact olarak yukle (onizleme)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-video
          path: uretim/*/Videos/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Uretim durumunu geri commit et
        if: always()
        run: |
          git config user.name  "uretim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add icerik/uretilenler.json icerik/basarisiz.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: uretim ilerlemesi (otomatik)"
            git pull --rebase --autostash origin main || true
            git push || echo "push basarisiz (yaris); sonraki calisma toparlar"
          else
            echo "Uretimde degisiklik yok."
          fi
